name: Daily livecheck

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  livecheck:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Tap checkout
        run: brew tap --custom-remote nurazon59/tap "$GITHUB_WORKSPACE"
      - name: Check upstream versions
        run: brew livecheck --cask --tap nurazon59/tap | tee "$GITHUB_STEP_SUMMARY"
