name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casks:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Tap checkout
        run: brew tap --custom-remote nurazon59/tap "$GITHUB_WORKSPACE"
      - name: Check style
        run: brew style Casks/*.rb
      - name: Audit casks
        run: brew audit --cask --online nurazon59/tap/gather-v2
      - name: Verify download checksum
        run: brew fetch --cask nurazon59/tap/gather-v2
      - name: Check upstream version
        run: brew livecheck --cask nurazon59/tap/gather-v2
